<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Бюджет</title>
  <meta name="description" content="Дневной бюджет с переносом остатка. Данные хранятся только на телефоне.">
  <meta name="theme-color" content="#0b0d0c">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Бюджет">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1290x2796.png">
  <link rel="stylesheet" href="styles.css">
  <script src="boot.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-month" viewBox="0 0 24 24"><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  </svg>

  <div id="fatal" class="fatal" role="alert" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>

  <section id="start-failure" class="start-failure" hidden>
    <h1>Приложение не запустилось</h1>
    <p>Твои траты не затронуты: они лежат в памяти телефона отдельно от файлов приложения.</p>
    <p id="start-failure-detail" class="small muted"></p>
    <button type="button" class="btn btn-primary" id="start-reload">Загрузить заново</button>
    <p id="start-failure-note" class="small muted">Для этого нужен интернет.</p>
  </section>

  <div id="app"></div>
  <p class="start-hint">Приложение не открылось? Закрой его и запусти снова с интернетом. Твои траты не затронуты.</p>

  <nav id="tabs" class="tabs" aria-label="Разделы" hidden>
    <button type="button" class="tab" id="tab-today" data-tab="today"><svg class="icon" aria-hidden="true"><use href="#i-today"/></svg><span>Сегодня</span></button>
    <button type="button" class="tab" id="tab-month" data-tab="month"><svg class="icon" aria-hidden="true"><use href="#i-month"/></svg><span>Месяц</span></button>
    <button type="button" class="tab" id="tab-settings" data-tab="settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span>Настройки</span></button>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <noscript><p class="noscript">Для работы приложения нужен JavaScript.</p></noscript>
</body>
</html>
